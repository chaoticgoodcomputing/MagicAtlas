services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      # Host 55432 → container 5432, to avoid colliding with a stock local Postgres.
      - "55432:5432"
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data

volumes:
  atlas-pgdata:
